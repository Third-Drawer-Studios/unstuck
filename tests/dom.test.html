<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unstuck — browser tests</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #101318; color: #eef1f6; margin: 0; padding: 20px 20px 60px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  #summary { margin: 0 0 18px; color: #97a1b3; }
  #summary.pass strong { color: #56d6a0; }
  #summary.fail strong { color: #ff7a7a; }
  ol { list-style: none; margin: 0; padding: 0; max-width: 900px; }
  li { padding: 7px 10px; border-left: 3px solid #2c333f; margin-bottom: 4px; background: #191d25; border-radius: 0 8px 8px 0; }
  li.pass { border-left-color: #56d6a0; }
  li.fail { border-left-color: #ff7a7a; }
  li .why { display: block; color: #ff9d9d; font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: pre-wrap; margin-top: 4px; }
  #rig { position: fixed; right: 12px; bottom: 12px; width: 380px; height: 700px;
         border: 1px solid #2c333f; border-radius: 12px; transform: scale(0.42);
         transform-origin: bottom right; opacity: 0.85; }
</style>
</head>
<body>
<h1>Unstuck — browser tests</h1>
<p id="summary">Running…</p>
<ol id="results"></ol>
<iframe id="rig" title="app under test"></iframe>

<script>
// Drives the real app in an iframe: real CSS, real DOM wiring, real localStorage.
// Covers what the Node suite structurally cannot. Open via ./test.sh --browser.
// The drag gesture is NOT covered here — synthetic pointer events cannot hold a
// pointer capture — so it is verified by hand against a real device.
(() => {
  'use strict';

  const APP_URL = '../index.html';
  const results = document.getElementById('results');
  const tests = [];
  let passed = 0, failed = 0;

  const test = (name, fn) => tests.push({ name, fn });

  function record(name, error) {
    const li = document.createElement('li');
    li.className = error ? 'fail' : 'pass';
    li.textContent = (error ? '✖ ' : '✔ ') + name;
    if (error) {
      const why = document.createElement('span');
      why.className = 'why';
      why.textContent = error.stack || String(error);
      li.appendChild(why);
      failed++;
    } else {
      passed++;
    }
    results.appendChild(li);
  }

  function assert(condition, message) {
    if (!condition) throw new Error(message || 'assertion failed');
  }

  function equal(actual, expected, message) {
    if (actual !== expected) {
      throw new Error((message || 'not equal') + '\n  expected: ' + JSON.stringify(expected) + '\n  actual:   ' + JSON.stringify(actual));
    }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function waitFor(fn, what, timeout) {
    const limit = Date.now() + (timeout || 3000);
    for (;;) {
      let value;
      try { value = fn(); } catch (err) { value = null; }
      if (value) return value;
      if (Date.now() > limit) throw new Error('timed out waiting for ' + (what || 'condition'));
      await sleep(25);
    }
  }

  /** Boots the app in the rig with the given saved state (or a raw string). */
  async function boot(saved) {
    const frame = document.getElementById('rig');
    // Same-origin, so the app's storage is reachable from here.
    localStorage.removeItem('unstuck.v1');
    if (saved !== undefined) {
      localStorage.setItem('unstuck.v1', typeof saved === 'string' ? saved : JSON.stringify(saved));
    }
    await new Promise((resolve) => {
      frame.onload = resolve;
      frame.src = APP_URL + '?t=' + Date.now();
    });
    const win = frame.contentWindow;
    await waitFor(() => win.document.getElementById('app'), 'app to render');
    return { win, doc: win.document, $: (id) => win.document.getElementById(id) };
  }

  const stored = () => JSON.parse(localStorage.getItem('unstuck.v1'));
  const shown = (win, el) => el && win.getComputedStyle(el).display !== 'none';

  /** Waits for the riffle animation to land — the announcer only fires on settle. */
  const settled = (app) => waitFor(
    () => app.$('announcer').textContent.startsWith('Picked:') && app.$('cardWhat').textContent,
    'a pick to settle'
  );

  /** The options sheet, and the edit dialog that sits behind it. */
  const openListOptions = (app) => app.$('listOptionsBtn').click();
  function openEditDialog(app) {
    openListOptions(app);
    app.$('actionsEdit').click();
  }

  /** Opens the one list in a booted app, ready to drive its detail screen. */
  async function openTheList(app) {
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    return app;
  }

  /** A held press, as the list grid reads one. */
  async function longPress(app, el) {
    const opts = { bubbles: true, pointerId: 1, clientX: 10, clientY: 10 };
    el.dispatchEvent(new app.win.PointerEvent('pointerdown', opts));
    await sleep(600);
    el.dispatchEvent(new app.win.PointerEvent('pointerup', opts));
    el.click();
  }

  /** Boots a one-list app and opens its colour picker, ready to drive. */
  async function openColourPicker() {
    const app = await boot(stateOf([listOf('once', 'House', ['Wash up'])]));
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    openEditDialog(app);
    await waitFor(() => app.$('listDialog').open, 'the edit dialog');
    app.$('addColorBtn').click();
    await waitFor(() => shown(app.win, app.$('colorWheel')), 'the colour wheel');
    return app;
  }

  function listOf(kind, name, texts, display) {
    return {
      id: 'l-' + name, name, kind, color: 'sky',
      keepDone: Boolean(display && display.keepDone),
      showProgress: Boolean(display && display.showProgress),
      items: texts.map((t, i) => ({ id: name + '-' + i, text: t, done: false, doneAt: 0, count: 0, lastDone: 0 })),
    };
  }
  const stateOf = (lists, selection) => ({ schema: 1, lists, selection: selection || [], history: [] });

  // ------------------------------------------------------------- the tests

  test('hidden elements are really hidden, not just marked', async () => {
    const app = await boot(stateOf([listOf('once', 'A', ['one'])]));
    // Regression: several of these set an explicit display, which beat [hidden].
    equal(shown(app.win, app.$('backBtn')), false, 'back button must not show on Decide');
    equal(shown(app.win, app.$('screenLists')), false, 'the Lists screen must be hidden');
    equal(shown(app.win, app.$('card')), false, 'no card before a pick');
    equal(shown(app.win, app.$('onboard')), false, 'onboarding must not show when lists exist');
    equal(shown(app.win, app.$('pickBtn')), true, 'the pick button must be visible');
  });

  test('a first run offers onboarding instead of an empty picker', async () => {
    const app = await boot();
    equal(shown(app.win, app.$('onboard')), true);
    equal(shown(app.win, app.$('pickBtn')), false);
    equal(shown(app.win, app.$('chips')), false, 'no chips when there are no lists');
  });

  test('the starter picker adds only the lists that were chosen', async () => {
    const app = await boot();
    app.$('seedBtn').click();
    await waitFor(() => app.$('starterDialog').open, 'the starter dialog');
    const options = app.doc.querySelectorAll('#starterOptions .starter');
    assert(options.length >= 4, 'the picker must offer a real choice');
    equal([...options].every((o) => o.getAttribute('aria-pressed') === 'false'), true,
      'nothing may be preselected — unasked-for lists are the clutter this app fights');
    equal(app.$('starterAdd').disabled, true, 'cannot add nothing');

    // The name element holds a text node plus a kind badge; only the text is the name.
    const nameOf = (opt) => opt.querySelector('.name').firstChild.nodeValue;
    const wanted = [nameOf(options[0]), nameOf(options[2])];
    options[0].click();
    options[2].click();
    equal(app.$('starterAdd').textContent, 'Add 2 lists');
    app.$('starterAdd').click();

    await waitFor(() => stored() && stored().lists.length === 2, 'the chosen lists');
    equal(stored().lists.map((l) => l.name).join(', '), wanted.join(', '), 'added the wrong lists');
    equal(shown(app.win, app.$('pickBtn')), true, 'the picker becomes usable');
    equal(app.doc.querySelectorAll('#chips .chip').length, 3, 'Everything plus one chip per list');
  });

  test('starter lists can be added again later and undone', async () => {
    const app = await boot(stateOf([listOf('once', 'Mine', ['Something'])]));
    app.$('tabLists').click();
    app.$('starterBtn').click();
    await waitFor(() => app.$('starterDialog').open, 'the starter dialog');
    app.doc.querySelector('#starterOptions .starter').click();
    app.$('starterAdd').click();
    await waitFor(() => stored().lists.length === 2, 'the added list');
    app.$('toastAction').click();
    await waitFor(() => stored().lists.length === 1, 'the undo');
    equal(stored().lists[0].name, 'Mine', 'undo removed the wrong list');
  });

  test('a list kind can be changed after creation, keeping every item', async () => {
    const books = listOf('once', 'Books', ['Piranesi', 'Station Eleven'], { keepDone: true, showProgress: true });
    books.items[0].done = true;
    const app = await boot(stateOf([books]));
    equal(app.doc.querySelector('#chips .chip .count').textContent, '1', 'one unchecked book to start');

    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    openEditDialog(app);
    await waitFor(() => app.$('listDialog').open, 'the edit dialog');
    equal(shown(app.win, app.$('kindField')), true, 'the kind must be editable, not locked');

    app.doc.querySelector('input[name="kind"][value="endless"]').checked = true;
    app.$('listForm').dispatchEvent(new app.win.Event('submit', { cancelable: true }));
    await waitFor(() => stored().lists[0].kind === 'endless', 'the kind change');

    equal(stored().lists[0].items.length, 2, 'no item may be lost');
    equal(stored().lists[0].items[0].done, true, 'the check is kept, just ignored');
    app.$('tabDecide').click();
    equal(app.doc.querySelector('#chips .chip .count').textContent, '2', 'checked items rejoin the pool');
  });

  test('a checked item becomes a one-session entry when switched to ongoing', async () => {
    // Regression: it stayed struck through with a 0x tally, reading as both
    // finished and never done.
    const app = await boot(stateOf([listOf('once', 'Books', ['Piranesi', 'Station Eleven'], { keepDone: true, showProgress: true })]));
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    app.doc.querySelector('#openItems .check').click();
    await waitFor(() => stored().lists[0].items[0].done, 'the check');

    openEditDialog(app);
    app.doc.querySelector('input[name="kind"][value="endless"]').checked = true;
    app.$('listForm').dispatchEvent(new app.win.Event('submit', { cancelable: true }));
    await waitFor(() => stored().lists[0].kind === 'endless', 'the kind change');

    const rows = app.doc.querySelectorAll('#openItems .item');
    equal(rows.length, 2, 'every item belongs in an ongoing list');
    equal([...rows].some((r) => r.classList.contains('checked')), false, 'nothing may be struck out as ongoing');
    equal(shown(app.win, app.$('doneSection')), false, 'an ongoing list has no done section');
    const tallies = [...app.doc.querySelectorAll('#openItems .tally')].map((t) => t.textContent);
    equal(tallies.join(','), '1×,0×', 'the checked one must read as one session');
  });

  test('sessions logged as ongoing show as checked when switched back', async () => {
    const app = await boot(stateOf([listOf('endless', 'Practice', ['Guitar', 'Spanish'])]));
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    const tally = app.doc.querySelector('#openItems .tally');
    for (let i = 0; i < 3; i++) app.doc.querySelector('#openItems .tally').click();
    await waitFor(() => stored().lists[0].items[0].count === 3, 'three logged sessions');

    openEditDialog(app);
    app.doc.querySelector('input[name="kind"][value="once"]').checked = true;
    app.doc.querySelector('input[name="keep"][value="clear"]').checked = true;
    app.$('listForm').dispatchEvent(new app.win.Event('submit', { cancelable: true }));
    await waitFor(() => stored().lists[0].kind === 'once', 'the kind change');

    equal(app.doc.querySelectorAll('#doneItems .item').length, 1, 'the practised one reads as done');
    equal(app.doc.querySelectorAll('#openItems .item').length, 1, 'the untouched one is still open');
    equal(stored().lists[0].items[0].count, 3, 'the tally must survive');
  });

  test('undoing a kind change puts the list back as it was', async () => {
    const app = await boot(stateOf([listOf('once', 'House', ['Wash up'])]));
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    openEditDialog(app);
    app.doc.querySelector('input[name="kind"][value="endless"]').checked = true;
    app.$('listForm').dispatchEvent(new app.win.Event('submit', { cancelable: true }));
    await waitFor(() => stored().lists[0].kind === 'endless', 'the kind change');
    equal(app.$('toastText').textContent, 'This list is now: Ongoing');
    app.$('toastAction').click();
    await waitFor(() => stored().lists[0].kind === 'once', 'the undo');
  });

  // ------------------------------------------------------ list options

  test('nothing that edits a list sits next to the row that adds to one', async () => {
    // Regression: Edit list sat directly above the add row and got pressed by
    // people reaching to add an item.
    const app = await openTheList(await boot(stateOf([listOf('once', 'House', ['Wash up'])])));
    equal(app.$('editListBtn'), null, 'the edit button must not be back on the detail screen');
    equal(app.$('deleteListBtn'), null, 'nor the delete button');
    equal(shown(app.win, app.$('listOptionsBtn')), true, 'the options button replaces both');
    equal(app.doc.querySelector('#screenList .detail-foot'), null, 'and the footer with it');
  });

  test('the options sheet deletes a list, and the delete can be undone', async () => {
    const app = await openTheList(await boot(stateOf([listOf('once', 'House', ['Wash up'])])));
    openListOptions(app);
    await waitFor(() => app.$('actionsDialog').open, 'the options sheet');
    equal(app.$('actionsSub').textContent, 'House', 'the sheet must name the list it acts on');

    app.$('actionsDelete').click();
    await waitFor(() => stored().lists.length === 0, 'the delete');
    equal(app.$('actionsDialog').open, false, 'the sheet closes behind it');

    app.$('toastAction').click();
    await waitFor(() => stored().lists.length === 1, 'the undo');
    equal(stored().lists[0].items.length, 1, 'the list comes back with its contents');
  });

  test('a long press on a list opens its options instead of opening the list', async () => {
    const app = await boot(stateOf([listOf('once', 'House', ['Wash up'])]));
    app.$('tabLists').click();
    await longPress(app, app.doc.querySelector('#listGrid .list-card'));
    await waitFor(() => app.$('actionsDialog').open, 'the options sheet');
    equal(shown(app.win, app.$('screenList')), false, 'the press must not also open the list');
    equal(app.$('actionsSub').textContent, 'House');
  });

  test('a plain tap on a list still opens it', async () => {
    const app = await boot(stateOf([listOf('once', 'House', ['Wash up'])]));
    app.$('tabLists').click();
    const card = app.doc.querySelector('#listGrid .list-card');
    card.dispatchEvent(new app.win.PointerEvent('pointerdown', { bubbles: true, pointerId: 1, clientX: 10, clientY: 10 }));
    card.dispatchEvent(new app.win.PointerEvent('pointerup', { bubbles: true, pointerId: 1, clientX: 10, clientY: 10 }));
    card.click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    equal(app.$('actionsDialog').open, false, 'a quick tap is not a long press');
  });

  test('a long press deleting a list from the grid leaves no detail screen behind', async () => {
    const app = await boot(stateOf([listOf('once', 'House', ['Wash up']), listOf('once', 'Work', ['Email'])]));
    app.$('tabLists').click();
    await longPress(app, app.doc.querySelectorAll('#listGrid .list-card')[1]);
    await waitFor(() => app.$('actionsDialog').open, 'the options sheet');
    app.$('actionsDelete').click();
    await waitFor(() => stored().lists.length === 1, 'the delete');
    equal(stored().lists[0].name, 'House', 'the wrong list was deleted');
    equal(shown(app.win, app.$('screenLists')), true, 'the grid must stay on screen');
  });

  // ----------------------------------------------------------- subtasks

  /** Adds a subtask to the nth open item through the row's own + button. */
  async function addSub(app, index, text) {
    app.doc.querySelectorAll('#openItems .addsub')[index].click();
    const input = await waitFor(() => app.doc.querySelector('#openItems .sub-input'), 'the subtask input');
    input.value = text;
    input.dispatchEvent(new app.win.Event('input', { bubbles: true }));
    input.dispatchEvent(new app.win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  }

  test('a subtask is added, listed under its thing, and counted', async () => {
    const app = await openTheList(await boot(stateOf([listOf('once', 'House', ['Sort the pile'])])));
    await addSub(app, 0, 'Clothes away');
    await waitFor(() => stored().lists[0].items[0].subs.length === 1, 'the subtask');

    equal(stored().lists[0].items[0].subs[0].text, 'Clothes away');
    equal(app.doc.querySelectorAll('#openItems .subs li .text').length, 1, 'it must show under its thing');
    equal(app.doc.querySelector('#openItems .item .count').textContent, '0/1');
    equal(app.doc.querySelectorAll('#openItems .item').length, 1, 'a subtask is not a second item');
  });

  test('subtasks never join the pool', async () => {
    const app = await openTheList(await boot(stateOf([listOf('once', 'House', ['Sort the pile'])])));
    await addSub(app, 0, 'Clothes away');
    await addSub(app, 0, 'Hoover');
    await waitFor(() => stored().lists[0].items[0].subs.length === 2, 'both subtasks');
    app.$('tabDecide').click();
    equal(app.doc.querySelector('#chips .chip .count').textContent, '1',
      'one pickable thing, however many steps it has');
  });

  test('checking the last subtask checks the thing off', async () => {
    const app = await openTheList(await boot(stateOf([listOf('once', 'House', ['Sort the pile'])])));
    await addSub(app, 0, 'Clothes away');
    await addSub(app, 0, 'Hoover');
    await waitFor(() => stored().lists[0].items[0].subs.length === 2, 'both subtasks');

    const boxes = () => app.doc.querySelectorAll('#openItems .subs .check');
    boxes()[0].click();
    await waitFor(() => stored().lists[0].items[0].subs[0].done, 'the first check');
    equal(stored().lists[0].items[0].done, false, 'half done is not done');

    app.doc.querySelectorAll('#openItems .subs .check, #doneItems .subs .check')[1].click();
    await waitFor(() => stored().lists[0].items[0].done, 'the thing to finish itself');
    equal(stored().lists[0].items[0].count, 1, 'and to count as one completion');
  });

  test('unchecking one subtask puts the thing back in the pool, keeping the others', async () => {
    const list = listOf('once', 'House', ['Sort the pile'], { keepDone: true });
    list.items[0].subs = [
      { id: 's1', text: 'Clothes away', done: true },
      { id: 's2', text: 'Hoover', done: true },
    ];
    list.items[0].done = true;
    list.items[0].count = 1;
    const app = await openTheList(await boot(stateOf([list])));

    app.doc.querySelectorAll('#openItems .subs .check')[0].click();
    await waitFor(() => stored().lists[0].items[0].done === false, 'the thing to reopen');
    equal(stored().lists[0].items[0].subs[1].done, true, 'the other step must be left alone');
    app.$('tabDecide').click();
    equal(app.doc.querySelector('#chips .chip .count').textContent, '1', 'it is pickable again');
  });

  test('checking the thing itself settles its subtasks with it', async () => {
    const list = listOf('once', 'House', ['Sort the pile'], { keepDone: true });
    list.items[0].subs = [{ id: 's1', text: 'Clothes away', done: false }];
    const app = await openTheList(await boot(stateOf([list])));

    app.doc.querySelector('#openItems .item > .check').click();
    await waitFor(() => stored().lists[0].items[0].done, 'the check');
    equal(stored().lists[0].items[0].subs[0].done, true, 'the step is part of the thing');
  });

  test('adding a subtask to a finished thing reopens it', async () => {
    const list = listOf('once', 'House', ['Sort the pile'], { keepDone: true });
    list.items[0].done = true;
    list.items[0].count = 1;
    const app = await openTheList(await boot(stateOf([list])));

    app.doc.querySelector('#openItems .addsub').click();
    const input = await waitFor(() => app.doc.querySelector('#openItems .sub-input'), 'the subtask input');
    input.value = 'One more bit';
    input.dispatchEvent(new app.win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));

    await waitFor(() => stored().lists[0].items[0].done === false, 'the thing to reopen');
    equal(stored().lists[0].items[0].subs.length, 1);
  });

  test('a picked card shows the steps, and finishing them accepts the pick', async () => {
    const list = listOf('once', 'House', ['Sort the pile']);
    list.items[0].subs = [{ id: 's1', text: 'Clothes away', done: false }];
    const app = await boot(stateOf([list]));
    app.$('pickBtn').click();
    await settled(app);

    equal(shown(app.win, app.$('cardSubs')), true, 'the card must say what doing it involves');
    equal(app.doc.querySelector('#cardSubs .label').textContent, 'Clothes away');

    app.doc.querySelector('#cardSubs .step').click();
    await waitFor(() => stored().lists[0].items[0].done, 'the pick to be accepted');
    equal(app.$('doBtn').textContent, 'Pick another', 'the card must move to its accepted state');
    equal(shown(app.win, app.$('cardSubs')), false, 'the checklist is done with');
  });

  test('undoing an accept driven by the card checklist restores every step', async () => {
    const list = listOf('once', 'House', ['Sort the pile']);
    list.items[0].subs = [{ id: 's1', text: 'Clothes away', done: false }];
    const app = await boot(stateOf([list]));
    app.$('pickBtn').click();
    await settled(app);

    app.doc.querySelector('#cardSubs .step').click();
    await waitFor(() => stored().lists[0].items[0].done, 'the accept');
    app.$('toastAction').click();
    await waitFor(() => stored().lists[0].items[0].done === false, 'the undo');
    equal(stored().lists[0].items[0].subs[0].done, false, 'the step must come back unchecked');
    equal(stored().lists[0].items[0].count, 0, 'and the completion must be withdrawn');
  });

  test('an ongoing thing clears its steps once a session is logged', async () => {
    const list = listOf('endless', 'Practice', ['Guitar']);
    list.items[0].subs = [{ id: 's1', text: 'Scales', done: false }];
    const app = await openTheList(await boot(stateOf([list])));

    app.doc.querySelector('#openItems .subs .check').click();
    await waitFor(() => stored().lists[0].items[0].count === 1, 'the logged session');
    equal(stored().lists[0].items[0].subs[0].done, false, 'the steps reset for next time');
  });

  test('a subtask can be deleted, and the delete undone', async () => {
    const list = listOf('once', 'House', ['Sort the pile']);
    list.items[0].subs = [{ id: 's1', text: 'Clothes away', done: false }];
    const app = await openTheList(await boot(stateOf([list])));

    app.doc.querySelector('#openItems .subs .kill').click();
    await waitFor(() => stored().lists[0].items[0].subs.length === 0, 'the delete');
    app.$('toastAction').click();
    await waitFor(() => stored().lists[0].items[0].subs.length === 1, 'the undo');
    equal(stored().lists[0].items[0].subs[0].text, 'Clothes away');
  });

  // -------------------------------------------------- dragging things about

  const centreOf = (el) => {
    const b = el.getBoundingClientRect();
    return { x: Math.round(b.left + b.width / 2), y: Math.round(b.top + b.height / 2) };
  };

  /**
   * Holds a row, drags it to `to` (an element, or a point for "nowhere"), and
   * lets go. Real pointer coordinates, because the drop target is decided by
   * what is under the finger, not by what the event was dispatched on.
   */
  async function dragRow(app, from, to) {
    const start = centreOf(from);
    const end = to && to.nodeType ? centreOf(to) : to;
    const at = (p) => ({ bubbles: true, pointerId: 1, clientX: p.x, clientY: p.y });
    from.dispatchEvent(new app.win.PointerEvent('pointerdown', at(start)));
    await sleep(600);
    app.doc.dispatchEvent(new app.win.PointerEvent('pointermove', at({ x: start.x, y: start.y + 8 })));
    app.doc.dispatchEvent(new app.win.PointerEvent('pointermove', at(end)));
    app.doc.dispatchEvent(new app.win.PointerEvent('pointerup', at(end)));
    await sleep(50);
  }

  test('the colour wheel maps where you press to the colour you get', async () => {
    const app = await openColourPicker();
    const el = app.$('colorWheel');
    const box = el.getBoundingClientRect();
    const r = box.width / 2;
    const press = (dx, dy) => {
      // Hue runs clockwise from the top: right is 90 degrees, bottom 180, left 270.
      el.dispatchEvent(new app.win.PointerEvent('pointerdown', {
        pointerId: 1, bubbles: true, clientX: box.left + r + dx, clientY: box.top + r + dy,
      }));
      el.dispatchEvent(new app.win.PointerEvent('pointerup', { pointerId: 1, bubbles: true }));
      return Math.round(app.win.UnstuckLogic.hexToHsv(app.$('colorHex').value).h);
    };

    const right = press(r * 0.9, 0);
    assert(Math.abs(right - 90) <= 2, 'the right edge should be hue 90, got ' + right);
    const bottom = press(0, r * 0.9);
    assert(Math.abs(bottom - 180) <= 2, 'the bottom should be hue 180, got ' + bottom);
    const left = press(-r * 0.9, 0);
    assert(Math.abs(left - 270) <= 2, 'the left edge should be hue 270, got ' + left);

    // The centre is white: no saturation, whatever the angle.
    press(0, 0);
    equal(app.win.UnstuckLogic.hexToHsv(app.$('colorHex').value).s, 0, 'the middle must be unsaturated');
  });

  async function bootAlarm(notification, registration) {
    const state = stateOf([listOf('once', 'Chores', ['Wash up'])]);

    const fromCentre = Math.hypot(marker.left + marker.width / 2 - (wheelBox.left + wheelBox.width / 2),
      marker.top + marker.height / 2 - (wheelBox.top + wheelBox.height / 2));
    assert(fromCentre <= wheelBox.width / 2 + 2, 'the marker sits on the wheel, ' + Math.round(fromCentre) + 'px out');

    // rgb() is what a colour usually gets copied as, so the box takes it.
    app.$('colorHex').value = 'rgb(0, 255, 136)';
    app.$('colorHex').dispatchEvent(new app.win.Event('blur', { bubbles: true }));
    await waitFor(() => stored().settings.accent === '#00ff88', 'the typed colour to land');
    equal(app.doc.documentElement.style.getPropertyValue('--accent').trim(), '#00ff88');
    equal(shown(app.win, app.$('colorError')), false, 'rgb() is a colour, not an error');

    app.$('colorDone').click();
    await waitFor(() => !app.$('colorDialog').open, 'the picker to close');
    equal(app.doc.querySelector('#accentSwatches [aria-pressed="true"]').dataset.color, '#00ff88',
      'and joins the row so it can be reselected');
    equal(stored().lists[0].color, 'sky', 'the list keeps its own colour');
  });

  test('the list options button cannot be mistaken for the app gear', async () => {
    // Regression: both were bare grey glyphs 8px apart in the same corner, and the
    // gear kept winning the thumb that was reaching for list options.
    const app = await boot(stateOf([listOf('once', 'Chores', ['Wash up'])]));
    openTheList(app, 0);
    const opts = app.$('listOptionsBtn');
    const gear = app.$('dataBtn');

    assert(/options/i.test(opts.textContent), 'it has to say what it is, not just draw a glyph');
    const optsStyle = app.win.getComputedStyle(opts);
    const gearStyle = app.win.getComputedStyle(gear);
    assert(optsStyle.color !== gearStyle.color, 'both were ' + gearStyle.color);
    assert(parseFloat(optsStyle.borderTopWidth) > 0, 'the gear has no border; this one does');
    assert(opts.getBoundingClientRect().width > gear.getBoundingClientRect().width + 20,
      'a different silhouette, not just a different colour');
    equal(opts.getAttribute('aria-label'), 'Options for this list', 'the glyph must not reach a reader');

    opts.click();
    await waitFor(() => app.$('actionsDialog').open, 'the options sheet');
  });

  test('the lists can be sorted, and the choice sticks', async () => {
    const app = await boot(stateOf([
      listOf('once', 'Chores', ['Wash up', 'Bins out', 'Hoover']),
      listOf('once', 'Books', ['Piranesi']),
    ]));
    app.$('tabLists').click();
    // firstChild only: the name div also carries the kind badge.
    const names = () => [...app.doc.querySelectorAll('#listGrid .list-card .name')].map(
      (n) => n.firstChild.nodeValue);
    equal(names().join(', '), 'Chores, Books', 'as added, until asked otherwise');

    const sort = app.$('listSort');
    equal(shown(app.win, app.$('sortRow')), true, 'two lists is enough to want an order');
    sort.value = 'az';
    sort.dispatchEvent(new app.win.Event('change', { bubbles: true }));
    equal(names().join(', '), 'Books, Chores', 'the grid must actually reorder');

    sort.value = 'most';
    sort.dispatchEvent(new app.win.Event('change', { bubbles: true }));
    equal(names().join(', '), 'Chores, Books', 'three left beats one');

    await waitFor(() => stored().settings.listSort === 'most', 'the choice to save');
    const again = await boot(stored());
    again.$('tabLists').click();
    equal(again.$('listSort').value, 'most', 'the control has to show the order it is in');
    equal([...again.doc.querySelectorAll('#listGrid .list-card .name')].map((n) => n.firstChild.nodeValue).join(', '),
      'Chores, Books', 'and the grid must come back sorted, not just the control');

    // The stored order is what "as added" means, so sorting may never rewrite it.
    equal(stored().lists.map((l) => l.name).join(', '), 'Chores, Books', 'the saved order is untouched');
  });

  test('one list has nothing to sort, so the control stays out of the way', async () => {
    const app = await boot(stateOf([listOf('once', 'Chores', ['Wash up'])]));
    app.$('tabLists').click();
    equal(shown(app.win, app.$('sortRow')), false, 'a sort over one row is noise');
  });

  /** Types into the search box the way a keyboard does: value, then the event. */
  function search(app, text) {
    const box = app.$('listSearch');
    box.value = text;
    box.dispatchEvent(new app.win.Event('input', { bubbles: true }));
  }

  const resultTexts = (app) => [...app.doc.querySelectorAll('#searchResults .result .text')]
    .map((el) => el.textContent);
  const resultLists = (app) => [...app.doc.querySelectorAll('#searchResults .result-list .name')]
    .map((el) => el.textContent);

  /** Two lists and a step, which is every place a thing can be hiding. */
  function searchState() {
    const admin = listOf('once', 'Admin', ['Pay that bill', 'Renew the passport']);
    admin.items[1].subs = [{ id: 'sub-signup', text: 'Sign up for an account', done: false }];
    return stateOf([admin, listOf('once', 'House', ['Wash up', 'Sign for the parcel'])]);
  }

  test('searching the lists says which list a thing is on', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    equal(shown(app.win, app.$('searchRow')), true, 'there is plenty written down to search');
    equal(shown(app.win, app.$('listGrid')), true, 'the grid is what you see before you ask');

    search(app, 'sign up for');
    equal(shown(app.win, app.$('listGrid')), false, 'results replace the grid, not crowd it');
    equal(resultLists(app).join(', '), 'Admin', 'the list it is on is the whole answer');
    equal(resultTexts(app).join(', '), 'Sign up for an account');
    equal(app.$('searchCount').textContent, '1 match in 1 list');
  });

  test('one query reaching two lists shows both, grouped', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    search(app, 'sign');
    equal(resultLists(app).join(', '), 'Admin, House', 'both lists have one');
    equal(resultTexts(app).join(' | '), 'Sign up for an account | Sign for the parcel');
    equal(app.$('searchCount').textContent, '2 matches in 2 lists');
  });

  test('a step says whose step it is, and opening it marks that step', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    search(app, 'sign up');
    const row = app.doc.querySelector('#searchResults .result');
    equal(row.querySelector('.under').textContent, 'step of Renew the passport');
    equal(row.getAttribute('aria-label'),
      'Sign up for an account, a step of Renew the passport, in Admin',
      'read on its own, a result still has to name its list');

    row.click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    const found = app.doc.querySelectorAll('#screenList li.found');
    equal(found.length, 1, 'exactly one row may be marked');
    equal(found[0].dataset.sub, 'sub-signup', 'and it has to be the step that was asked for');
  });

  test('opening a result marks the thing itself, and the next render lets it go', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    search(app, 'parcel');
    app.doc.querySelector('#searchResults .result').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    const marked = app.doc.querySelector('#screenList li.found');
    equal(marked.dataset.item, 'House-1');

    // Checking it off repaints the list, which is where the mark is supposed to go.
    marked.querySelector('.check').click();
    equal(app.doc.querySelector('#screenList li.found'), null, 'the mark must not outlive the trip');
  });

  test('tapping the list a result sits under opens that list, unmarked', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    search(app, 'sign');
    app.doc.querySelector('#searchResults .result-list').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    equal(app.$('detailTitle').lastElementChild.textContent, 'Admin');
    equal(app.doc.querySelector('#screenList li.found'), null, 'no one thing was asked for');
  });

  test('the run that matched is marked, and a list’s own words are never markup', async () => {
    const app = await boot(stateOf([listOf('once', 'Admin', ['Email <b>bold</b> Sam'])]));
    app.$('tabLists').click();
    search(app, '<b>bold');
    const text = app.doc.querySelector('#searchResults .result .text');
    equal(text.textContent, 'Email <b>bold</b> Sam', 'the text has to survive intact');
    equal(text.querySelector('mark').textContent, '<b>bold', 'the matched run is what gets marked');
    equal(text.querySelector('b'), null, 'a list that writes markup must never have it parsed');
  });

  test('a search ignores case and accents, so what you typed is close enough', async () => {
    const app = await boot(stateOf([listOf('once', 'Admin', ['Book a café table'])]));
    app.$('tabLists').click();
    search(app, 'CAFE');
    equal(resultTexts(app).join(', '), 'Book a café table');
    equal(app.doc.querySelector('#searchResults mark').textContent, 'café',
      'the mark must land on the real characters, not the folded ones');
  });

  test('a checked-off thing is still findable, and shows as checked', async () => {
    const state = stateOf([listOf('once', 'Admin', ['Sign the form'])], []);
    state.lists[0].keepDone = true;
    state.lists[0].items[0].done = true;
    const app = await boot(state);
    app.$('tabLists').click();
    search(app, 'sign');
    const row = app.doc.querySelector('#searchResults .result');
    equal(row.textContent.includes('Sign the form'), true, 'finishing it does not unwrite it');
    equal(row.classList.contains('checked'), true, 'and the result has to say it is done');
  });

  test('a list found by its own name is offered, and counted', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    search(app, 'house');
    equal(resultLists(app).join(', '), 'House');
    equal(resultTexts(app).length, 0, 'nothing written down in it says "house"');
    equal(app.$('searchCount').textContent, '1 match in 1 list',
      'a row on the screen may never be reported as no matches');
    equal(app.doc.querySelector('#searchResults .result-list').getAttribute('aria-label'),
      'Open House', 'a bare name among results has to say what tapping it does');
  });

  test('a search that finds nothing says so rather than showing an empty screen', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    search(app, 'kayak');
    equal(app.doc.querySelectorAll('#searchResults .result').length, 0);
    equal(shown(app.win, app.$('searchEmpty')), true);
    equal(app.$('searchEmpty').textContent, 'Nothing here matches “kayak”.');
    equal(app.$('searchCount').textContent, '', 'no count belongs on nothing');
  });

  test('clearing the search gives the lists back', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    equal(shown(app.win, app.$('searchClear')), false, 'nothing to clear yet');

    search(app, 'sign');
    equal(shown(app.win, app.$('searchClear')), true);
    app.$('searchClear').click();

    equal(app.$('listSearch').value, '', 'the box has to empty with it');
    equal(shown(app.win, app.$('listGrid')), true, 'the grid comes back');
    equal(shown(app.win, app.$('searchResults')), false);
    equal(app.doc.activeElement === app.$('listSearch') || app.doc.activeElement.id === 'listSearch',
      true, 'clearing leaves you ready to type the next one');
  });

  test('leaving the lists behind ends the search', async () => {
    const app = await boot(searchState());
    app.$('tabLists').click();
    search(app, 'sign');
    app.$('tabDecide').click();
    app.$('tabLists').click();
    equal(app.$('listSearch').value, '', 'a stale search would hide the lists on the way back in');
    equal(shown(app.win, app.$('listGrid')), true);
  });

  test('nothing written down anywhere is nothing to search', async () => {
    const app = await boot(stateOf([listOf('once', 'Admin', [])]));
    app.$('tabLists').click();
    equal(shown(app.win, app.$('searchRow')), false, 'an empty list gives a search nothing to do');
  });

  test('the tip jar leaves the app safely, and stays at the bottom of Settings', async () => {
    const app = await boot(stateOf([listOf('once', 'Chores', ['Wash up'])]));
    app.$('dataBtn').click();
    const tip = app.$('tipLink');
    equal(shown(app.win, tip), true, 'it should be reachable, just not loud');
    equal(tip.getAttribute('href'), 'https://ko-fi.com/dreamdrawerstudio', 'a dead link is worse than none');
    equal(tip.getAttribute('target'), '_blank');
    // Without noopener the opened page can reach back through window.opener.
    const rel = tip.getAttribute('rel').split(/\s+/);
    equal(rel.includes('noopener'), true, 'the tab it opens must not reach back');
    equal(rel.includes('noreferrer'), true);

    // Nothing may fetch from ko-fi while the app is running: the app's promise is
    // that nothing leaves the device until you deliberately tap out of it.
    const html = app.doc.documentElement.outerHTML;
    equal(/<(script|img|iframe)[^>]+ko-fi/i.test(html), false, 'no third-party asset may be embedded');

    const actions = app.doc.querySelector('#dataDialog .dlg-actions');
    equal(actions.compareDocumentPosition(tip) & app.win.Node.DOCUMENT_POSITION_FOLLOWING,
      app.win.Node.DOCUMENT_POSITION_FOLLOWING, 'it belongs under the buttons, not among them');
  });

  test('the privacy policy is reachable from the data controls, and is ours', async () => {
    const app = await boot(stateOf([listOf('once', 'Chores', ['Wash up'])]));
    app.$('dataBtn').click();
    const link = app.$('privacyLink');
    equal(shown(app.win, link), true, 'a promise with no way to check it is worth less');
    // Relative, so it works off the filesystem, on GitHub Pages and inside the wrap.
    equal(link.getAttribute('href'), './privacy.html', 'it must not point off-site');
    const rel = link.getAttribute('rel').split(/\s+/);
    equal(rel.includes('noopener'), true, 'the tab it opens must not reach back');
    equal(rel.includes('noreferrer'), true);
  });

  test('the privacy page loads nothing from anywhere else', async () => {
    const res = await fetch('../privacy.html');
    equal(res.ok, true, 'the policy has to actually be there — a dead URL fails store review');
    const html = await res.text();
    // The page states that nothing leaves the device; it may not itself be a
    // counter-example. The Ko-fi href is a link, not a fetched asset.
    equal(/<script/i.test(html), false, 'a privacy page has no business running code');
    equal(/<(img|iframe|link[^>]+stylesheet|source)[^>]+https?:/i.test(html), false,
      'no third-party asset may be embedded');
    equal(html.includes('Privacy Policy'), true);
  });

  test('turning animation off makes a pick land instantly', async () => {
    const state = stateOf([listOf('once', 'Chores', ['Wash up', 'Bins out'])]);
    state.settings = { textScale: 'normal', contrast: 'normal', motion: 'reduced', speak: false };
    const app = await boot(state);
    app.$('pickBtn').click();
    // No riffle: the text is final on the very next frame.
    await sleep(60);
    assert(['Wash up', 'Bins out'].includes(app.$('cardWhat').textContent),
      'expected a settled pick, got ' + app.$('cardWhat').textContent);
  });

  test('leaving a list goes back a screen rather than out of the app', async () => {
    // Android's back gesture is history.back(); without an entry it would exit.
    const app = await boot(stateOf([listOf('once', 'Chores', ['Wash up'])]));
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');

    app.win.history.back();
    await waitFor(() => !shown(app.win, app.$('screenList')), 'the detail to close');
    equal(shown(app.win, app.$('screenLists')), true, 'and to land on the lists, still inside the app');
  });

  test('the add field sits within thumb reach, not at the top of the screen', async () => {
    const app = await boot(stateOf([listOf('once', 'Chores', ['Wash up', 'Bins out'])]));
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    const box = app.$('addForm').getBoundingClientRect();
    assert(box.top > app.win.innerHeight * 0.6,
      'the add field is at ' + Math.round(box.top) + ' of ' + app.win.innerHeight + ', too high to reach one-handed');
  });

  test('an ongoing list offers neither display choice', async () => {
    const app = await boot(stateOf([listOf('endless', 'Keep', ['Guitar'])]));
    app.$('tabLists').click();
    app.doc.querySelector('#listGrid .list-card').click();
    await waitFor(() => shown(app.win, app.$('screenList')), 'the list detail');
    equal(shown(app.win, app.$('detailProgress')), false, 'progress is meaningless with no end');
    openEditDialog(app);
    await waitFor(() => app.$('listDialog').open, 'the edit dialog');
    equal(shown(app.win, app.$('keepField')), false, 'nothing is ever finished, so nothing to place');
    equal(shown(app.win, app.$('progressField')), false);
    app.doc.querySelector('input[name="kind"][value="once"]').checked = true;
    app.doc.querySelector('input[name="kind"][value="once"]').dispatchEvent(new app.win.Event('change', { bubbles: true }));
    equal(shown(app.win, app.$('keepField')), true, 'switching to check-off reveals them');
    equal(shown(app.win, app.$('progressField')), true);
  });

  test('changes survive a reload', async () => {
    const app = await boot(stateOf([listOf('endless', 'Keep', ['Practise guitar'])]));
    app.$('pickBtn').click();
    await settled(app);
    app.$('doBtn').click();
    await waitFor(() => stored().lists[0].items[0].count === 1, 'the logged session');
    const again = await boot(stored());
    equal(again.doc.querySelector('#chips .chip .count').textContent, '1');
    equal(stored().lists[0].items[0].count, 1);
  });

  test('unreadable saved data warns instead of silently starting empty', async () => {
    const app = await boot('{ this is not json');
    equal(shown(app.win, app.$('banner')), true, 'the user must be told');
    equal(shown(app.win, app.$('screenDecide')), true, 'the app must still run');
    equal(localStorage.getItem('unstuck.v1'), '{ this is not json', 'the damaged copy must be left alone');
  });

  test('saved data of the wrong shape warns instead of throwing', async () => {
    const app = await boot({ lists: 'not an array' });
    equal(shown(app.win, app.$('banner')), true);
    equal(shown(app.win, app.$('onboard')), true, 'the app falls back to onboarding');
  });

  test('every visible control has an accessible name', async () => {
    const app = await boot(stateOf([listOf('once', 'House', ['Wash up'])]));
    const unnamed = [];
    for (const el of app.doc.querySelectorAll('button, input')) {
      if (!shown(app.win, el) || !el.offsetParent) continue;
      const name = (el.getAttribute('aria-label') || el.textContent || el.value || '').trim();
      if (!name) unnamed.push(el.id || el.className);
    }
    equal(unnamed.join(', '), '', 'controls with no accessible name');
  });

  // ------------------------------------------------------------------ run

  (async () => {
    for (const { name, fn } of tests) {
      try {
        await fn();
        record(name, null);
      } catch (err) {
        record(name, err);
      }
    }
    localStorage.removeItem('unstuck.v1');
    const summary = document.getElementById('summary');
    summary.className = failed ? 'fail' : 'pass';
    summary.innerHTML = '<strong>' + (failed ? failed + ' failing' : 'all passing') + '</strong> — '
      + passed + ' of ' + (passed + failed) + ' checks';
    window.__unstuckTestResults = { passed, failed };
    document.title = (failed ? '✖ ' : '✔ ') + passed + '/' + (passed + failed) + ' — Unstuck tests';
  })();
})();
</script>
</body>
